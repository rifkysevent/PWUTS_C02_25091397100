<section id="pencarian">
  <input type="text" id="cari-menu" placeholder="Cari menu favoritmu..." />
</section>

<section class="banner-slider">
  <div class="banner-track">
    <img src="aset/Gambar.png" alt="Menu kopi Kafe-in" />
  </div>
</section>

<section id="kategori">
  <div class="daftar-kategori">
    <button class="kategori-item active" data-kategori="semua">Semua</button>

    <button class="kategori-item" data-kategori="kopi">Kopi</button>

    <button class="kategori-item" data-kategori="nonkopi">Non Kopi</button>

    <button class="kategori-item" data-kategori="snack">Snack</button>
  </div>
</section>

<section id="daftar-menu">
  <div class="daftar-produk">
    <article class="kartu-produk" data-kategori="kopi" data-harga="15000">
      <div class="gambar-produk">
        <img src="aset/latte.jpg" alt="Coffee Latte" />
      </div>

      <div class="info-produk">
        <h3>Coffee Latte</h3>

        <div class="baris-harga">
          <p>Rp15.000</p>
          <button class="btn-tambah" aria-label="Tambah Coffee Latte">
            <i class="fa-solid fa-plus"></i>
          </button>
        </div>
      </div>
    </article>

    <article class="kartu-produk" data-kategori="nonkopi" data-harga="18000">
      <div class="gambar-produk">
        <img src="aset/matcha.jpg" alt="Cappuccino" />
      </div>

      <div class="info-produk">
        <h3>Matcha</h3>

        <div class="baris-harga">
          <p>Rp18.000</p>
          <button class="btn-tambah" aria-label="Tambah Cappuccino">
            <i class="fa-solid fa-plus"></i>
          </button>
        </div>
      </div>
    </article>

    <article class="kartu-produk" data-kategori="snack" data-harga="12000">
      <div class="gambar-produk">
        <img src="aset/croissant.jpg" alt="Croissant" />
      </div>

      <div class="info-produk">
        <h3>Croissant</h3>

        <div class="baris-harga">
          <p>Rp12.000</p>
          <button class="btn-tambah" aria-label="Tambah Croissant">
            <i class="fa-solid fa-plus"></i>
          </button>
        </div>
      </div>
    </article>
  </div>
</section>
